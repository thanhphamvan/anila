[package]
name = "anila-service"
description = "Runs on the host machine: dials out to the host room and serves tmux and herdr sessions over PTYs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "anila-service"
path = "src/main.rs"

[dependencies]
anila-proto = { workspace = true, features = ["zstd-encode"] }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
portable-pty.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core", "std"] }
rand_core.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
sha2 = { workspace = true, features = ["std"] }
base64.workspace = true
ureq.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
